teal-l);border-color:var(--teal-border);color:var(--teal-d)}.footer-dl-ico{width:13px;height:13px;flex-shrink:0}.footer-rules-btn{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;padding:0;color:var(--soft);font-size:11.5px;cursor:pointer;white-space:nowrap}.footer-rules-btn:hover{color:var(--teal-d);text-decoration:underline}@media (max-width:1024px){.page-shell{padding:10px 14px 10px}.doc-title-sizer{max-width:156px}.font-trig-sep,.font-trig-latin{display:none}.font-picker-trigger{max-width:172px}.md-btn{width:22px;height:22px}}@media (max-width:820px){html,body{height:var(--app-vh,100dvh);min-height:0;overflow:hidden}.page-shell{position:fixed;top:var(--app-vtop,0px);left:0;right:0;height:var(--app-vh,100dvh);min-height:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:6px;overflow:hidden}.mobile-mode-bar{display:flex}.workbench-resizer{display:none}.workbench-grid{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:6px;height:100%;min-height:0}.workbench-grid .panel-preview{grid-row:1;order:1}.workbench-grid .panel-source{grid-row:2;order:2}.workbench-grid[data-mobile-mode="write"]{grid-template-rows:minmax(0,1fr)}.workbench-grid[data-mobile-mode="write"] .panel-preview{display:none}.workbench-grid[data-mobile-mode="write"] .panel-source{grid-row:1}.workbench-grid[data-mobile-mode="preview"]{grid-template-rows:minmax(0,1fr)}.workbench-grid[data-mobile-mode="preview"] .panel-source{display:none}.workbench-grid[data-mobile-mode="preview"] .panel-preview{grid-row:1}.source-backdrop,.source-textarea{font-size:16px;line-height:1.56;padding:10px 12px 16px}.ml-prose{padding:10px 14px 18px}.trace-drawer.is-open{height:min(var(--trace-height),38%);margin-top:6px}html.is-kb-open .page-shell{padding:4px 6px 4px;gap:4px}html.is-kb-open .site-header{min-height:30px}html.is-kb-open .saffron-rule,html.is-kb-open .mobile-mode-bar,html.is-kb-open .site-footer,html.is-kb-open .pane-foot{display:none}html.is-kb-open .pane-head{flex:0 0 28px;height:28px;padding:0 8px}html.is-kb-open .font-picker-trigger{height:22px;font-size:11px}html.is-kb-open .source-backdrop,html.is-kb-open .source-textarea{padding:6px 10px 10px}html.is-kb-open .ml-prose{padding:6px 12px 10px}.versions-layout{grid-template-columns:1fr;grid-template-rows:200px 1fr}.versions-sidebar{border-right:0;border-bottom:1px solid var(--line)}}@media (max-width:600px){.site-header{flex-direction:row;align-items:center;justify-content:space-between;gap:6px;min-height:34px}.site-title{font-size:18px}.header-actions{flex-wrap:nowrap;justify-content:flex-end;gap:4px}.title-sep,.doc-title-sizer,.doc-sync-pill,.btn-label{display:none}#btn-versions{min-width:28px;width:28px;padding:0}.pill-count{display:none !important}.panel-preview .pane-head,.panel-source .pane-head{padding:0 8px;gap:6px}.panel-preview .pane-title,.panel-source .pane-title{font-size:12px}.font-picker-trigger{max-width:156px;padding:0 6px;font-size:11.5px}.rule-tabs-grid{grid-template-columns:repeat(2,1fr)}.site-footer{height:auto;flex:0 0 auto;padding:4px 0 2px;gap:6px}.modal-backdrop{align-items:flex-end;padding:0}.modal-card,.modal-card-wide{width:100%;max-height:90dvh;border-radius:10px 10px 0 0;padding-bottom:env(safe-area-inset-bottom)}}@media print{html,body{background:#ffffff !important;color:#000000 !important;height:auto !important;overflow:visible !important}.site-header,.mobile-mode-bar,.panel-source,.workbench-resizer,.panel-preview .panel-stripe,.panel-preview .pane-head,.panel-preview .pane-foot,.trace-drawer,.site-footer,.font-picker-popover,.modal-backdrop,.tooltip-popover,.toast{display:none !important}.page-shell,.workbench-stage,.workbench-grid,.panel-preview,.preview-scroll{display:block !important;height:auto !important;max-width:none !important;padding:0 !important;margin:0 !important;border:0 !important;box-shadow:none !important;overflow:visible !important}.ml-prose{padding:0 !important;color:#000000 !important}.mz-word.is-synced,.mz-word.is-surgical{background:transparent !important;box-shadow:none !important;border:0 !important}}

</head>
<body>
  <div class="page-shell" id="app-shell">
    <!-- 1. Calm Single-Row Editorial Masthead -->
    <header class="site-header">
      <div class="header-left">
        <div class="saffron-rule" aria-hidden="true"></div>
        <div class="title-row">
          <h1 class="site-title" lang="ml">വരമൊഴി</h1>
          <span class="title-sep" aria-hidden="true">/</span>
          <span class="doc-title-sizer">
            <span class="doc-title-mirror" id="doc-title-mirror" aria-hidden="true">Untitled note…</span>
            <input
              id="doc-title-input"
              class="doc-title-input"
              type="text"
              size="1"
              placeholder="Untitled note…"
              aria-label="Document title"
              maxlength="120"
            />
          </span>
          <button
            type="button"
            id="btn-doc-sync-pill"
            class="doc-sync-pill"
            aria-haspopup="dialog"
            title="Saved in this browser — click to link a local .md file or manage settings"
          >
            <span class="doc-sync-dot" id="doc-sync-dot" aria-hidden="true"></span>
            <span id="doc-sync-label">Saved</span>
          </button>
        </div>
      </div>

      <div class="header-actions" role="toolbar" aria-label="Document actions">
        <div class="btn-pair" role="group" aria-label="Undo and redo">
          <button
            type="button"
            id="btn-undo"
            class="btn-secondary btn-icon-pair"
            disabled
            aria-label="Undo"
            title="Undo (⌘Z / Ctrl+Z)"
          >↶</button>
          <button
            type="button"
            id="btn-redo"
            class="btn-secondary btn-icon-pair"
            disabled
            aria-label="Redo"
            title="Redo (⌘⇧Z / Ctrl+Y)"
          >↷</button>
        </div>

        <button
          type="button"
          id="btn-versions"
          class="btn-secondary"
          aria-haspopup="dialog"
          title="Named versions and comparison (⌘⇧H)"
        >
          <svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="10" cy="10" r="7.2" />
            <polyline points="10 5.8 10 10.2 13 12" />
          </svg>
          <span class="btn-label">Versions</span>
          <span class="pill-count" id="versions-count-badge" aria-hidden="true"></span>
        </button>

        <div class="split-btn-wrap" id="export-split-wrap">
          <button
            type="button"
            id="btn-copy-primary"
            class="btn-primary split-btn-main"
            title="Copy formatted and plain Malayalam (⌘⇧C)"
          >
            <span class="btn-copy-label">Copy</span>
          </button>
          <button
            type="button"
            id="btn-export-menu"
            class="btn-primary split-btn-caret"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="export-menu"
            aria-label="More copy, export, and storage options"
            title="Google Docs, copy formats, download &amp; sync"
          >▾</button>
          <div id="export-menu" class="editorial-menu" role="menu" aria-hidden="true"></div>
        </div>

        <button
          type="button"
          id="btn-theme"
          class="btn-secondary btn-theme-toggle"
          aria-label="Switch to dark theme"
          aria-pressed="false"
          title="Switch to dark theme"
        >
          <span class="theme-icon" id="theme-icon" aria-hidden="true">☾</span>
        </button>
      </div>
    </header>

    <!-- Mobile-only View Switcher (hidden >= 821px) -->
    <div class="mobile-mode-bar" id="mobile-mode-bar" role="tablist" aria-label="Pane view mode">
      <div class="seg-tabs">
        <button type="button" role="tab" aria-selected="true" class="seg-tab is-active" data-mode="split">Split</button>
        <button type="button" role="tab" aria-selected="false" class="seg-tab" data-mode="write">Write</button>
        <button type="button" role="tab" aria-selected="false" class="seg-tab" data-mode="preview">Preview</button>
      </div>
    </div>

    <!-- 2. Two-Pane Writing Workbench + Collapsible Docked Rule Trace -->
    <main class="workbench-stage" id="workbench-stage">
      <section class="workbench-grid" id="workbench-grid" data-mobile-mode="split" aria-label="Writing workbench">
        <!-- Left Pane (Below on Mobile Split): Manglish Source -->
        <div class="panel panel-source" id="panel-source" role="region" aria-label="Manglish and Markdown source editor">
          <div class="panel-stripe stripe-saff" aria-hidden="true"></div>
          <div class="pane-head">
            <div class="pane-head-left">
              <h2 class="pane-title">Manglish</h2>
            </div>
            <div class="pane-head-right">
              <div class="md-micro-bar" role="toolbar" aria-label="Markdown formatting">
                <button type="button" class="md-btn" data-md="bold" title="Bold (**text**) · ⌘B"><strong>B</strong></button>
                <button type="button" class="md-btn" data-md="italic" title="Italic (*text*) · ⌘I"><em>I</em></button>
                <button type="button" class="md-btn" data-md="link" aria-label="Insert link" title="Link ([text](url)) · ⌘K">
                  <svg class="md-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6.6 9.4a3 3 0 0 0 4.2 0l2-2a3 3 0 0 0-4.2-4.2L7.5 4.3" />
                    <path d="M9.4 6.6a3 3 0 0 0-4.2 0l-2 2a3 3 0 0 0 4.2 4.2l1.1-1.1" />
                  </svg>
                </button>
                <span class="md-sep" aria-hidden="true"></span>
                <button type="button" class="md-btn" data-md="heading" title="Cycle heading (# / ## / ###)">H</button>
                <button type="button" class="md-btn" data-md="ul" aria-label="Bullet list" title="Bullet list (- )">
                  <svg class="md-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                    <circle cx="3" cy="4.2" r="0.9" fill="currentColor" stroke="none" />
                    <circle cx="3" cy="8" r="0.9" fill="currentColor" stroke="none" />
                    <circle cx="3" cy="11.8" r="0.9" fill="currentColor" stroke="none" />
                    <line x1="6" y1="4.2" x2="13.5" y2="4.2" />
                    <line x1="6" y1="8" x2="13.5" y2="8" />
                    <line x1="6" y1="11.8" x2="13.5" y2="11.8" />
                  </svg>
                </button>
                <button type="button" class="md-btn md-mono-btn" data-md="ol" title="Numbered list (1. )">1.</button>
                <div class="md-more-wrap" id="md-more-wrap">
                  <button
                    type="button"
                    id="btn-md-more"
                    class="md-btn"
                    aria-haspopup="menu"
                    aria-expanded="false"
                    aria-controls="md-more-menu"
                    aria-label="More formatting tools"
                    title="Strikethrough, code, checklist, quote, rule &amp; table"
                  >⋯</button>
                  <div id="md-more-menu" class="md-more-menu" role="menu" aria-hidden="true"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="source-body" id="source-body">
            <div class="source-editor-wrap" id="source-editor-wrap">
              <pre class="source-backdrop" id="source-backdrop" aria-hidden="true"><code></code></pre>
              <label for="source-editor" class="sr-only">Manglish and Markdown source text</label>
              <textarea
                id="source-editor"
                class="source-textarea"
                spellcheck="false"
                autocomplete="off"
                autocapitalize="off"
                placeholder="Start typing Manglish + Markdown… e.g. # malayaaLam&#10;namaskaaram! \Mozhi 2 upayOgichch ezhuthaam."
              ></textarea>
            </div>
          </div>

          <div class="pane-foot">
            <button
              type="button"
              id="btn-open-guide"
              class="pane-guide-btn"
              aria-haspopup="dialog"
              title="Open interactive Mozhi 2 Typing Guide (⌘/ or F1)"
            >
              <svg class="ico-xs" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.5 3.2A1.7 1.7 0 0 1 4.2 1.5H13.5v11.3H4.2a1.7 1.7 0 0 0-1.7 1.7V3.2Z" />
                <path d="M2.5 14.5h11" />
              </svg>
              <span>Typing Guide</span>
            </button>
            <div class="pane-foot-right">
              <button
                type="button"
                id="btn-source-font-picker"
                class="source-font-trigger"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="font-picker-popover"
                title="Change Manglish editor font"
              >
                <span id="active-source-font-label">Inconsolata</span>
                <span class="cselect-caret" aria-hidden="true">▾</span>
              </button>
              <span class="pane-foot-sep" aria-hidden="true">·</span>
              <span class="pane-foot-metrics" id="source-metrics">0 words</span>
            </div>
          </div>
        </div>

        <!-- Draggable Vertical Split Resizer -->
        <div
          class="workbench-resizer"
          id="workbench-resizer"
          role="separator"
          aria-orientation="vertical"
          aria-valuemin="22"
          aria-valuemax="78"
          aria-valuenow="50"
          aria-label="Drag to resize source and preview panes"
          tabindex="0"
          title="Drag to resize panes (double-click to reset 50/50)"
        ></div>

        <!-- Right Pane (Above on Mobile Split): Live Rendered Malayalam Preview -->
        <div class="panel panel-preview" id="panel-preview" role="region" aria-label="Live rendered Malayalam document">
          <div class="panel-stripe stripe-teal" aria-hidden="true"></div>
          <div class="pane-head">
            <div class="pane-head-left">
              <h2 class="pane-title">Malayalam Preview</h2>
            </div>
            <div class="pane-head-right">
              <button
                type="button"
                id="btn-font-picker"
                class="font-picker-trigger"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="font-picker-popover"
                title="Choose Malayalam &amp; English fonts, text size, or custom Web Font"
              >
                <span class="font-trig-pair">
                  <span class="font-trig-ml" id="active-ml-font-label">Noto Serif Malayalam</span>
                  <span class="font-trig-sep is-hidden" id="active-font-sep" aria-hidden="true">·</span>
                  <span class="font-trig-latin is-hidden" id="active-latin-font-label"></span>
                </span>
                <span class="cselect-caret" aria-hidden="true">▾</span>
              </button>
            </div>
          </div>

          <div class="preview-scroll" id="preview-scroll">
            <div class="empty-sample-prompt is-hidden" id="empty-sample-prompt">
              <span>Empty note — start typing Manglish, or</span>
              <button type="button" id="btn-load-sample-empty" class="empty-sample-btn">Load sample document</button>
            </div>
            <article
              id="ml-preview"
              class="ml-prose"
              contenteditable="true"
              spellcheck="false"
              lang="ml"
              aria-label="Live rendered Malayalam document — click any word to sync, or edit and paste Malayalam directly"
              data-placeholder="നിങ്ങളുടെ മലയാളം ഇവിടെ തെളിയും…"
            ></article>
          </div>

          <div class="pane-foot">
            <div class="sync-status-strip is-visible" id="sync-status-strip">
              <span class="sync-word-pair" id="sync-word-pair"></span>
              <button
                type="button"
                id="btn-inline-trace"
                class="inline-trace-link"
                aria-expanded="false"
                aria-controls="trace-drawer"
                title="Toggle keystroke Rule Trace Inspector (⌘⇧T)"
              >Trace ▾</button>
            </div>
            <span class="pane-foot-metrics" id="preview-metrics">0 chars</span>
          </div>
        </div>
      </section>

      <!-- 3. Collapsible Docked Rule Trace Inspector (4 Logical Columns, Aligned Rule Grid) -->
      <section
        class="panel trace-drawer"
        id="trace-drawer"
        role="region"
        aria-label="Mozhi 2 keystroke rule trace inspector"
        aria-hidden="true"
      >
        <div
          class="trace-resizer"
          id="trace-resizer"
          role="separator"
          aria-orientation="horizontal"
          tabindex="0"
          aria-label="Drag to resize rule trace drawer"
          title="Drag to resize height"
        ></div>
        <div class="panel-stripe stripe-teal" aria-hidden="true"></div>
        <div class="trace-bar">
          <div class="trace-bar-left">
            <span class="trace-heading">Rule Trace</span>
            <span class="trace-word-summary" id="trace-word-summary"></span>
          </div>
          <div class="trace-cp-strip" id="trace-cp-strip" aria-label="Unicode codepoints of selected word"></div>
          <div class="trace-bar-right">
            <button
              type="button"
              id="btn-trace-rules"
              class="btn-subtle btn-xs"
              aria-haspopup="dialog"
              title="Inspect or change Mozhi 2 rules spreadsheet"
            >Rules ⚙</button>
            <button type="button" id="btn-copy-trace" class="btn-subtle btn-xs">Copy</button>
            <button type="button" id="btn-close-trace" class="popup-close" aria-label="Close Rule Trace">×</button>
          </div>
        </div>
        <div class="trace-table-scroll" id="trace-table-scroll">
          <table class="trace-table" id="trace-table">
            <thead>
              <tr>
                <th class="col-step">#</th>
                <th class="col-rule" colspan="7">Matched Rule</th>
                <th class="col-buf">Buffer</th>
                <th class="col-src">Source</th>
              </tr>
            </thead>
            <tbody id="trace-tbody"></tbody>
          </table>
          <div class="trace-empty" id="trace-empty">
            Click or place the cursor inside any word to inspect its Mozhi 2 keystroke rules.
          </div>
        </div>
      </section>
    </main>

    <!-- 4. Quiet Editorial Colophon Footer -->
    <footer class="site-footer">
      <span class="footer-left">
        <span class="footer-rule" aria-hidden="true"></span>
        <span lang="ml">വരമൊഴി</span>
        <span class="footer-sep" aria-hidden="true">·</span>
        <button
          type="button"
          id="btn-footer-rules"
          class="footer-rules-btn"
          aria-haspopup="dialog"
          title="Inspect or change Mozhi 2 rules spreadsheet"
        >
          <span class="sync-dot" id="rules-sync-dot" aria-hidden="true"></span>
          <span id="rules-status-text">Mozhi 2 rules</span>
        </button>
      </span>
      <span class="footer-right">
        <button
          type="button"
          id="btn-download-app-footer"
          class="btn-footer-download"

function renderVisualMarkdownExample(item) {

wrap.textContent = '• ' + md.replace(/^-\s*/, '');
} else if (item.label === 'Checklist') {
wrap.textContent = '☐ ' + md.replace(/^- \[ \]\s*/, '');
